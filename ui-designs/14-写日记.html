<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>界面十四：写日记 - 宠物健康管家</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background: #f0f0f0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

.phone-frame {
  width: 375px;
  height: 812px;
  background: #F8F6F2;
  border-radius: 40px;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  position: relative;
  display: flex;
  flex-direction: column;
}

.status-bar {
  padding: 12px 24px 6px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: #333;
  font-weight: 600;
}

.nav-bar {
  padding: 8px 16px 12px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.nav-back {
  width: 32px;
  height: 32px;
  border-radius: 16px;
  background: #fff;
  border: none;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  flex-shrink: 0;
}

.nav-title {
  font-size: 16px;
  font-weight: 700;
  color: #2D2D2D;
  flex: 1;
}

.form-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 10px 16px 0;
}

.form-card {
  background: #fff;
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.03);
  margin-bottom: 14px;
}

.form-row {
  display: flex;
  align-items: center;
  padding: 14px 16px;
  border-bottom: 1px solid #F5F2ED;
  min-height: 48px;
  cursor: pointer;
}

.form-row:last-child { border-bottom: none; }
.form-row.no-click { cursor: default; }

.form-label {
  font-size: 14px;
  font-weight: 600;
  color: #555;
  width: 60px;
  flex-shrink: 0;
}

.form-label.required::after {
  content: ' *';
  color: #FF5252;
  font-size: 12px;
}

.form-value {
  flex: 1;
  font-size: 14px;
  color: #2D2D2D;
  text-align: right;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 6px;
}

.form-value.placeholder { color: #C8B8A0; }

.form-arrow { font-size: 14px; color: #CCC; flex-shrink: 0; }

/* Textarea */
.textarea-row {
  padding: 14px 16px;
  border-bottom: 1px solid #F5F2ED;
}

.textarea-label {
  font-size: 14px;
  font-weight: 600;
  color: #555;
  margin-bottom: 10px;
}

.textarea-label.required::after {
  content: ' *';
  color: #FF5252;
  font-size: 12px;
}

.textarea-field {
  width: 100%;
  min-height: 120px;
  font-size: 14px;
  color: #2D2D2D;
  border: none;
  background: none;
  outline: none;
  resize: none;
  font-family: inherit;
  line-height: 1.6;
}

.textarea-field::placeholder { color: #C8B8A0; }

/* Media upload */
.media-section {
  padding: 14px 16px;
}

.media-label {
  font-size: 14px;
  font-weight: 600;
  color: #555;
  margin-bottom: 10px;
}

.media-grid {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.media-add {
  width: 72px;
  height: 72px;
  border-radius: 12px;
  background: #F5F2ED;
  border: 1.5px dashed #D8D0C4;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  font-size: 20px;
  color: #C8B8A0;
  cursor: pointer;
}

.media-add span { font-size: 10px; color: #B8A898; }

.media-thumb {
  width: 72px;
  height: 72px;
  border-radius: 12px;
  background: #E8E4DC;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  position: relative;
}

.media-thumb .remove {
  position: absolute;
  top: -6px;
  right: -6px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: #FF5252;
  color: #fff;
  font-size: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.media-hint { font-size: 11px; color: #BBB; margin-top: 8px; }

/* Tags */
.tag-section {
  padding: 14px 16px;
}

.tag-label {
  font-size: 14px;
  font-weight: 600;
  color: #555;
  margin-bottom: 10px;
}

.tag-cloud {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 10px;
}

.tag-chip {
  padding: 6px 14px;
  border-radius: 14px;
  font-size: 12px;
  font-weight: 600;
  color: #999;
  background: #F5F2ED;
  border: none;
  cursor: pointer;
}

.tag-chip.selected {
  background: #FFF3E0;
  color: #FF9800;
  border: 1.5px solid #FF9800;
}

.tag-chip .remove-tag {
  margin-left: 4px;
  font-size: 10px;
  opacity: 0.5;
  cursor: pointer;
}

.tag-chip.custom .remove-tag { display: inline; }

.tag-add-row {
  display: flex;
  gap: 8px;
  align-items: center;
}

.tag-add-input {
  flex: 1;
  padding: 8px 12px;
  border-radius: 14px;
  border: 1.5px dashed #D8D0C4;
  font-size: 12px;
  color: #2D2D2D;
  outline: none;
  font-family: inherit;
  background: #F5F2ED;
}

.tag-add-input::placeholder { color: #C8B8A0; }

.tag-add-btn {
  padding: 8px 16px;
  border-radius: 14px;
  font-size: 12px;
  font-weight: 600;
  background: #FFF3E0;
  color: #FF9800;
  border: none;
  cursor: pointer;
  white-space: nowrap;
}

.tag-add-btn:active { background: #FFE0B2; }

.save-section { padding: 20px 0 30px; }

.save-btn {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #FF9800, #FFB74D);
  color: #fff;
  font-size: 16px;
  font-weight: 700;
  border: none;
  border-radius: 14px;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(255, 152, 0, 0.3);
}

.save-btn:active { transform: scale(0.98); opacity: 0.9; }

/* Overlay */
.overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.4);
  display: none;
  align-items: flex-end;
  justify-content: center;
  z-index: 10;
}

.overlay.show { display: flex; }

.action-sheet {
  background: #fff;
  border-radius: 16px 16px 0 0;
  width: 100%;
  padding: 8px 0 30px;
}

.action-sheet-title {
  text-align: center;
  font-size: 13px;
  color: #999;
  padding: 14px 0;
  border-bottom: 1px solid #F0EDE8;
}

.action-sheet-item {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 16px;
  font-size: 15px;
  font-weight: 600;
  color: #2D2D2D;
  cursor: pointer;
  border-bottom: 1px solid #F5F2ED;
}

.action-sheet-item:active { background: #FAFAFA; }

.action-sheet-cancel {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  font-size: 15px;
  color: #999;
  cursor: pointer;
  margin-top: 8px;
  font-weight: 500;
}

/* Date picker */
.date-picker-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,0.4);
  display: none;
  align-items: flex-end;
  z-index: 10;
}

.date-picker-overlay.show { display: flex; }

.date-picker-panel {
  background: #fff;
  border-radius: 16px 16px 0 0;
  width: 100%;
  padding: 16px;
}

.date-picker-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

.date-picker-cancel { color: #999; font-size: 14px; cursor: pointer; }
.date-picker-confirm { color: #FF9800; font-size: 14px; font-weight: 700; cursor: pointer; }
.date-picker-title { font-size: 15px; font-weight: 700; color: #2D2D2D; }

.date-picker-columns {
  display: flex;
  gap: 12px;
  height: 180px;
  overflow: hidden;
}

.date-picker-col {
  flex: 1;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  text-align: center;
}

.date-picker-item {
  padding: 10px 0;
  font-size: 16px;
  color: #CCC;
  scroll-snap-align: center;
  cursor: pointer;
}

.date-picker-item.selected {
  color: #2D2D2D;
  font-weight: 700;
  font-size: 18px;
}
</style>
</head>
<body>

<div class="phone-frame">
  <div class="status-bar">
    <span>9:41</span>
    <span>📶 🔋</span>
  </div>

  <div class="nav-bar">
    <button class="nav-back">‹</button>
    <div class="nav-title">写日记</div>
  </div>

  <div class="form-scroll">
    <div class="form-card">
      <div class="form-row" onclick="openDatePicker()">
        <span class="form-label required">日期</span>
        <div class="form-value placeholder" id="dateValue">
          请选择日期
          <span class="form-arrow">›</span>
        </div>
      </div>

      <div class="textarea-row">
        <div class="textarea-label required">内容</div>
        <textarea class="textarea-field" placeholder="记录花花的成长瞬间～"></textarea>
      </div>

      <div class="media-section">
        <div class="media-label">照片/视频</div>
        <div class="media-grid" id="mediaGrid">
          <div class="media-add" onclick="document.getElementById('mediaSheet').classList.add('show')">
            📷
            <span>添加</span>
          </div>
        </div>
        <div class="media-hint">支持照片，最多9张</div>
      </div>

      <div class="tag-section">
        <div class="tag-label">🏷️ 标签</div>
        <div class="tag-cloud" id="tagCloud">
          <button class="tag-chip" onclick="this.classList.toggle('selected')">🎂 生日</button>
          <button class="tag-chip" onclick="this.classList.toggle('selected')">🛁 第一次洗澡</button>
          <button class="tag-chip" onclick="this.classList.toggle('selected')">💉 第一次打疫苗</button>
          <button class="tag-chip" onclick="this.classList.toggle('selected')">🏥 第一次看病</button>
          <button class="tag-chip" onclick="this.classList.toggle('selected')">🐾 第一次出门</button>
          <button class="tag-chip" onclick="this.classList.toggle('selected')">✂️ 第一次剪毛</button>
          <button class="tag-chip" onclick="this.classList.toggle('selected')">🎾 学会新技能</button>
          <button class="tag-chip" onclick="this.classList.toggle('selected')">🏠 到家纪念日</button>
          <button class="tag-chip" onclick="this.classList.toggle('selected')">👫 交到新朋友</button>
          <button class="tag-chip" onclick="this.classList.toggle('selected')">📸 可爱瞬间</button>
        </div>
        <div class="tag-add-row">
          <input class="tag-add-input" id="tagInput" placeholder="输入自定义标签..." onkeydown="if(event.key==='Enter')addTag()">
          <button class="tag-add-btn" onclick="addTag()">＋ 添加</button>
        </div>
      </div>
    </div>

    <div class="save-section">
      <button class="save-btn">📝 发布日记</button>
    </div>
  </div>

  <!-- Media Selector -->
  <div class="overlay" id="mediaSheet" onclick="this.classList.remove('show')">
    <div class="action-sheet" onclick="event.stopPropagation()">
      <div class="action-sheet-title">添加照片</div>
      <div class="action-sheet-item" onclick="addMedia('album')">🖼️ 从相册选择</div>
      <div class="action-sheet-item" onclick="addMedia('camera')">📸 拍摄</div>
      <div class="action-sheet-cancel" onclick="document.getElementById('mediaSheet').classList.remove('show')">取消</div>
    </div>
  </div>

  <!-- Date Picker -->
  <div class="date-picker-overlay" id="datePicker" onclick="this.classList.remove('show')">
    <div class="date-picker-panel" onclick="event.stopPropagation()">
      <div class="date-picker-header">
        <span class="date-picker-cancel" onclick="document.getElementById('datePicker').classList.remove('show')">取消</span>
        <span class="date-picker-title">选择日期</span>
        <span class="date-picker-confirm" onclick="confirmDatePicker()">确定</span>
      </div>
      <div class="date-picker-columns">
        <div class="date-picker-col" id="yearCol"></div>
        <div class="date-picker-col" id="monthCol"></div>
        <div class="date-picker-col" id="dayCol"></div>
      </div>
    </div>
  </div>
</div>

<script>
var mediaCount = 0;

function addMedia(type) {
  document.getElementById('mediaSheet').classList.remove('show');
  if (mediaCount >= 9) return;

  var emoji = { album: '🖼️', camera: '📸', video: '🎬' }[type] || '📷';
  var thumb = document.createElement('div');
  thumb.className = 'media-thumb';
  thumb.innerHTML = emoji + '<span class="remove" onclick="event.stopPropagation(); this.parentElement.remove(); mediaCount--; updateAddBtn()">✕</span>';

  var addBtn = document.getElementById('mediaGrid').querySelector('.media-add');
  document.getElementById('mediaGrid').insertBefore(thumb, addBtn);
  mediaCount++;
  updateAddBtn();
}

function updateAddBtn() {
  var addBtn = document.getElementById('mediaGrid').querySelector('.media-add');
  addBtn.style.display = mediaCount >= 9 ? 'none' : 'flex';
}

function addTag() {
  var input = document.getElementById('tagInput');
  var text = input.value.trim();
  if (!text) return;

  var existing = document.querySelectorAll('#tagCloud .tag-chip');
  for (var i = 0; i < existing.length; i++) {
    if (existing[i].textContent.replace('✕', '').trim() === text) {
      input.value = '';
      return;
    }
  }

  var chip = document.createElement('button');
  chip.className = 'tag-chip selected custom';
  chip.innerHTML = text + ' <span class="remove-tag" onclick="event.stopPropagation(); this.parentElement.remove()">✕</span>';
  chip.onclick = function() { this.classList.toggle('selected'); };
  document.getElementById('tagCloud').appendChild(chip);
  input.value = '';
}

var selYear = 2026, selMonth = 8, selDay = 15;

function initDatePicker() {
  var yc = document.getElementById('yearCol'), mc = document.getElementById('monthCol'), dc = document.getElementById('dayCol');
  var yhtml = '', mhtml = '', dhtml = '';
  for (var y = 2026; y >= 2018; y--) yhtml += '<div class="date-picker-item'+(y===selYear?' selected':'')+'" onclick="pickYear('+y+')">'+y+'年</div>';
  for (var m = 1; m <= 12; m++) mhtml += '<div class="date-picker-item'+(m===selMonth?' selected':'')+'" onclick="pickMonth('+m+')">'+m+'月</div>';
  for (var d = 1; d <= 31; d++) dhtml += '<div class="date-picker-item'+(d===selDay?' selected':'')+'" onclick="pickDay('+d+')">'+d+'日</div>';
  yc.innerHTML = yhtml; mc.innerHTML = mhtml; dc.innerHTML = dhtml;
}
function pickYear(y) { selYear = y; initDatePicker(); }
function pickMonth(m) { selMonth = m; initDatePicker(); }
function pickDay(d) { selDay = d; initDatePicker(); }
function openDatePicker() {
  document.getElementById('datePicker').classList.add('show');
}
function confirmDatePicker() {
  var val = selYear + '-' + String(selMonth).padStart(2,'0') + '-' + String(selDay).padStart(2,'0');
  document.getElementById('dateValue').textContent = val;
  document.getElementById('dateValue').classList.remove('placeholder');
  document.getElementById('datePicker').classList.remove('show');
}
initDatePicker();
</script>
</body>
</html>
