<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>界面二：宠物详情页 - 宠物健康管家</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background: #f0f0f0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

.phone-frame {
  width: 375px;
  height: 812px;
  background: #F8F6F2;
  border-radius: 40px;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  position: relative;
  display: flex;
  flex-direction: column;
}

/* ---- Nav Bar ---- */
.nav-bar {
  padding: 12px 16px 0;
  display: flex;
  align-items: center;
  gap: 12px;
}

.nav-back {
  width: 32px;
  height: 32px;
  border-radius: 16px;
  background: #fff;
  border: none;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  flex-shrink: 0;
}

.nav-title {
  font-size: 16px;
  font-weight: 700;
  color: #2D2D2D;
}

/* ---- Pet Profile Card ---- */
.profile-card {
  margin: 16px;
  background: #fff;
  border-radius: 20px;
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  box-shadow: 0 2px 12px rgba(0,0,0,0.04);
  position: relative;
}

.profile-edit {
  position: absolute;
  top: 14px;
  right: 16px;
  font-size: 13px;
  color: #FF9800;
  font-weight: 600;
  cursor: pointer;
  padding: 4px 8px;
}

.profile-avatar {
  width: 80px;
  height: 80px;
  border-radius: 40px;
  background: linear-gradient(135deg, #FFE0B2, #FFCC80);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 44px;
  margin-bottom: 12px;
}

.profile-name {
  font-size: 20px;
  font-weight: 700;
  color: #2D2D2D;
  margin-bottom: 6px;
}

.profile-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: #888;
}

.profile-meta-dot {
  width: 3px;
  height: 3px;
  background: #DDD;
  border-radius: 50%;
}

.profile-gender-symbol {
  font-weight: 700;
  font-size: 14px;
}

.profile-gender-symbol.female {
  color: #EC407A;
}

.profile-gender-symbol.male {
  color: #42A5F5;
}

.profile-age-badge {
  background: #FFF3E0;
  color: #E65100;
  font-size: 12px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 10px;
  margin-top: 10px;
}

/* ---- Section Title ---- */
.section-title {
  padding: 0 20px;
  font-size: 13px;
  font-weight: 700;
  color: #999;
  margin-bottom: 10px;
  letter-spacing: 1px;
}

/* ---- Function Grid ---- */
.func-grid {
  padding: 0 16px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 16px;
}

.func-item {
  background: #fff;
  border-radius: 14px;
  padding: 16px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.03);
  transition: transform 0.15s;
  position: relative;
}

.func-item:active {
  transform: scale(0.97);
}

.func-icon {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}

.func-icon.vaccine { background: #E3F2FD; }
.func-icon.deworm { background: #F3E5F5; }
.func-icon.weight { background: #E8F5E9; }
.func-icon.medical { background: #FFEBEE; }
.func-icon.pedigree { background: #FFF8E1; }

.func-info {
  flex: 1;
  min-width: 0;
}

.func-name {
  font-size: 14px;
  font-weight: 700;
  color: #2D2D2D;
  margin-bottom: 2px;
}

.func-desc {
  font-size: 11px;
  color: #AAA;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.func-badge {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 7px;
  height: 7px;
  background: #FF5252;
  border-radius: 50%;
}

.func-grid .func-item.full-width {
  grid-column: 1 / -1;
}

/* ---- Quick Actions ---- */
.quick-actions {
  padding: 0 16px;
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
}

.quick-btn {
  flex: 1;
  background: #fff;
  border-radius: 14px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.03);
  transition: transform 0.15s;
  border: none;
  font-family: inherit;
}

.quick-btn:active {
  transform: scale(0.97);
}

.quick-btn-icon {
  font-size: 24px;
}

.quick-btn-label {
  font-size: 12px;
  font-weight: 600;
  color: #666;
}

/* ---- Tab Bar ---- */
.tab-bar {
  display: flex;
  background: #fff;
  border-top: 1px solid #F0EDE8;
  padding: 8px 0 20px;
  margin-top: auto;
}

.tab-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  cursor: pointer;
  position: relative;
}

.tab-icon {
  font-size: 22px;
}

.tab-label {
  font-size: 10px;
  color: #999;
  font-weight: 500;
}

.tab-item.active .tab-label {
  color: #FF9800;
  font-weight: 700;
}
</style>
</head>
<body>

<div class="phone-frame">
  <div class="nav-bar">
    <button class="nav-back">‹</button>
    <div class="nav-title">宠物档案</div>
  </div>

  <div class="profile-card">
    <div class="profile-edit">编辑</div>
    <div class="profile-avatar">🐱</div>
    <div class="profile-name">花花</div>
    <div class="profile-meta">
      <span>三花猫</span>
      <span class="profile-meta-dot"></span>
      <span class="profile-gender-symbol female">♀</span>
      <span>母</span>
    </div>
    <div class="profile-age-badge">🎂 2岁3个月</div>
  </div>

  <div class="section-title">📋 健康管理</div>

  <div class="func-grid">
    <div class="func-item">
      <div class="func-icon vaccine">💉</div>
      <div class="func-info">
        <div class="func-name">疫苗本</div>
        <div class="func-desc">最近：猫三联</div>
      </div>
      <div class="func-badge"></div>
    </div>

    <div class="func-item">
      <div class="func-icon deworm">🪱</div>
      <div class="func-info">
        <div class="func-name">驱虫记录</div>
        <div class="func-desc">体内 · 体外</div>
      </div>
      <div class="func-badge"></div>
    </div>

    <div class="func-item">
      <div class="func-icon weight">⚖️</div>
      <div class="func-info">
        <div class="func-name">体重曲线</div>
        <div class="func-desc">最近：4.2kg</div>
      </div>
    </div>

    <div class="func-item">
      <div class="func-icon medical">🏥</div>
      <div class="func-info">
        <div class="func-name">病史备注</div>
        <div class="func-desc">3 条记录</div>
      </div>
    </div>

    <div class="func-item full-width">
      <div class="func-icon pedigree">📜</div>
      <div class="func-info">
        <div class="func-name">血统信息</div>
        <div class="func-desc">可选填写 · 证书编号、父母品种、繁育者</div>
      </div>
    </div>
  </div>

  <div class="section-title">⚡ 快捷操作</div>
  <div class="quick-actions">
    <button class="quick-btn">
      <div class="quick-btn-icon">📸</div>
      <div class="quick-btn-label">写日记</div>
    </button>
    <button class="quick-btn">
      <div class="quick-btn-icon">📋</div>
      <div class="quick-btn-label">添加提醒</div>
    </button>
    <button class="quick-btn">
      <div class="quick-btn-icon">⚖️</div>
      <div class="quick-btn-label">记录体重</div>
    </button>
  </div>

  <div class="tab-bar">
    <div class="tab-item active">
      <div class="tab-icon">🐾</div>
      <div class="tab-label">宠物</div>
    </div>
    <div class="tab-item">
      <div class="tab-icon">📸</div>
      <div class="tab-label">相册</div>
    </div>
    <div class="tab-item">
      <div class="tab-icon">👤</div>
      <div class="tab-label">我的</div>
    </div>
  </div>
</div>

</body>
</html>
