<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>界面六：驱虫记录列表 - 宠物健康管家</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background: #f0f0f0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

.phone-frame {
  width: 375px;
  height: 812px;
  background: #F8F6F2;
  border-radius: 40px;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  position: relative;
  display: flex;
  flex-direction: column;
}

.status-bar {
  padding: 12px 24px 6px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: #333;
  font-weight: 600;
}

.nav-bar {
  padding: 8px 16px 4px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.nav-back {
  width: 32px;
  height: 32px;
  border-radius: 16px;
  background: #fff;
  border: none;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  flex-shrink: 0;
}

.nav-title {
  font-size: 16px;
  font-weight: 700;
  color: #2D2D2D;
  flex: 1;
}

.pet-mini {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  margin: 10px 16px;
  background: #fff;
  border-radius: 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.03);
}

.pet-mini-avatar { font-size: 28px; flex-shrink: 0; }
.pet-mini-name { font-size: 14px; font-weight: 700; color: #2D2D2D; }
.pet-mini-arrow { font-size: 14px; color: #CCC; margin-left: auto; }

.content-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 0 16px;
}

.section { margin-bottom: 16px; }

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 4px 10px;
}

.section-title {
  font-size: 14px;
  font-weight: 700;
  color: #555;
  display: flex;
  align-items: center;
  gap: 6px;
}

.section-count { font-size: 11px; color: #BBB; font-weight: 500; }
.section-add { font-size: 12px; color: #FF9800; font-weight: 600; cursor: pointer; }

.timeline {
  position: relative;
  padding-left: 28px;
}

.timeline::before {
  content: '';
  position: absolute;
  left: 11px;
  top: 0;
  bottom: 0;
  width: 2px;
  background: #E8E4DC;
}

.timeline-item {
  position: relative;
  margin-bottom: 14px;
}

.timeline-dot {
  position: absolute;
  left: -23px;
  top: 16px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #fff;
  border: 2px solid #C8B8A0;
  z-index: 1;
}

.timeline-dot.expiring {
  border-color: #FF5252;
  background: #FF5252;
}

.timeline-card {
  background: #fff;
  border-radius: 14px;
  padding: 14px 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.03);
  cursor: pointer;
}

.timeline-card:active { background: #FAFAFA; }

.timeline-card-title {
  font-size: 15px;
  font-weight: 700;
  color: #2D2D2D;
  margin-bottom: 6px;
}

.timeline-card-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  font-size: 12px;
  color: #999;
}

.timeline-card-meta-item {
  display: flex;
  align-items: center;
  gap: 4px;
}

.timeline-card-badge {
  display: inline-block;
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 600;
  margin-left: 8px;
  vertical-align: middle;
}

.timeline-card-badge.expiring { background: #FFEBEE; color: #D32F2F; }
.timeline-card-badge.ok { background: #E8F5E9; color: #2E7D32; }

.float-add {
  position: absolute;
  bottom: 100px;
  right: 20px;
  width: 48px;
  height: 48px;
  border-radius: 24px;
  background: linear-gradient(135deg, #FF9800, #FFB74D);
  color: #fff;
  font-size: 24px;
  border: none;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(255, 152, 0, 0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 5;
}

.tab-bar {
  display: flex;
  background: #fff;
  border-top: 1px solid #F0EDE8;
  padding: 8px 0 20px;
  margin-top: auto;
}

.tab-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  cursor: pointer;
  position: relative;
}

.tab-icon { font-size: 22px; }
.tab-label { font-size: 10px; color: #999; font-weight: 500; }
.tab-item.active .tab-label { color: #FF9800; font-weight: 700; }

/* Overlay */

.action-sheet-item {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 16px;
  font-size: 15px;
  font-weight: 600;
  color: #2D2D2D;
  cursor: pointer;
  border-bottom: 1px solid #F5F2ED;
}

.action-sheet-item:active { background: #FAFAFA; }

.action-sheet-cancel {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  font-size: 15px;
  color: #999;
  cursor: pointer;
  margin-top: 8px;
  font-weight: 500;
}
</style>
</head>
<body>

<div class="phone-frame">
  <div class="status-bar">
    <span>9:41</span>
    <span>📶 🔋</span>
  </div>

  <div class="nav-bar">
    <button class="nav-back">‹</button>
    <div class="nav-title">驱虫记录</div>
  </div>

  <div class="pet-mini">
    <div class="pet-mini-avatar">🐱</div>
    <div class="pet-mini-name">花花</div>
    <div class="pet-mini-arrow">›</div>
  </div>

  <div class="content-scroll">

    <div class="section">
      <div class="section-header">
        <div class="section-title">
          💊 体内驱虫
          <span class="section-count">2条</span>
        </div>
        <span class="section-add">＋ 添加</span>
      </div>

      <div class="timeline">
        <div class="timeline-item">
          <div class="timeline-dot expiring"></div>
          <div class="timeline-card">
            <div class="timeline-card-title">
              拜耳
              <span class="timeline-card-badge expiring">即将到期</span>
            </div>
            <div class="timeline-card-meta">
              <span class="timeline-card-meta-item">📅 用药：2026-02-15</span>
              <span class="timeline-card-meta-item">⏰ 下次：2026-08-15</span>
            </div>
          </div>
        </div>

        <div class="timeline-item">
          <div class="timeline-dot"></div>
          <div class="timeline-card">
            <div class="timeline-card-title">
              拜耳
              <span class="timeline-card-badge ok">已完成</span>
            </div>
            <div class="timeline-card-meta">
              <span class="timeline-card-meta-item">📅 用药：2025-08-15</span>
              <span class="timeline-card-meta-item">⏰ 下次：2026-02-15</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-header">
        <div class="section-title">
          🧴 体外驱虫
          <span class="section-count">1条</span>
        </div>
        <span class="section-add">＋ 添加</span>
      </div>

      <div class="timeline">
        <div class="timeline-item">
          <div class="timeline-dot"></div>
          <div class="timeline-card">
            <div class="timeline-card-title">
              大宠爱
              <span class="timeline-card-badge ok">已完成</span>
            </div>
            <div class="timeline-card-meta">
              <span class="timeline-card-meta-item">📅 用药：2026-01-20</span>
              <span class="timeline-card-meta-item">⏰ 下次：2026-07-20</span>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <button class="float-add">＋</button>

  <div class="tab-bar">
    <div class="tab-item active">
      <div class="tab-icon">🐾</div>
      <div class="tab-label">宠物</div>
    </div>
    <div class="tab-item">
      <div class="tab-icon">📸</div>
      <div class="tab-label">相册</div>
    </div>
    <div class="tab-item">
      <div class="tab-icon">👤</div>
      <div class="tab-label">我的</div>
    </div>
  </div>

</div>

</body>
</html>
