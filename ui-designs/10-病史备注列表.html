<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>界面十：病史备注列表 - 宠物健康管家</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background: #f0f0f0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

.phone-frame {
  width: 375px;
  height: 812px;
  background: #F8F6F2;
  border-radius: 40px;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  position: relative;
  display: flex;
  flex-direction: column;
}

.status-bar {
  padding: 12px 24px 6px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: #333;
  font-weight: 600;
}

.nav-bar {
  padding: 8px 16px 4px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.nav-back {
  width: 32px;
  height: 32px;
  border-radius: 16px;
  background: #fff;
  border: none;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  flex-shrink: 0;
}

.nav-title {
  font-size: 16px;
  font-weight: 700;
  color: #2D2D2D;
  flex: 1;
}

.content-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 0 16px;
}

.pet-mini {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  margin: 10px 0;
  background: #fff;
  border-radius: 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.03);
}

.pet-mini-avatar { font-size: 28px; flex-shrink: 0; }
.pet-mini-name { font-size: 14px; font-weight: 700; color: #2D2D2D; }
.pet-mini-arrow { font-size: 14px; color: #CCC; margin-left: auto; }

.category-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
  overflow-x: auto;
}

.category-tab {
  padding: 6px 14px;
  border-radius: 14px;
  font-size: 12px;
  font-weight: 600;
  color: #999;
  background: #fff;
  border: none;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
}

.category-tab.active {
  background: #FF9800;
  color: #fff;
}

.category-tab .count {
  font-weight: 400;
  opacity: 0.7;
  margin-left: 2px;
}

.record-card {
  background: #fff;
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.03);
  cursor: pointer;
}

.record-card:active { background: #FAFAFA; }

.record-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 8px;
}

.record-title {
  font-size: 15px;
  font-weight: 700;
  color: #2D2D2D;
  flex: 1;
}

.record-tag {
  font-size: 10px;
  padding: 3px 8px;
  border-radius: 10px;
  font-weight: 600;
  flex-shrink: 0;
  margin-left: 8px;
}

.record-tag.surgery { background: #FFEBEE; color: #D32F2F; }
.record-tag.illness { background: #FFF3E0; color: #E65100; }
.record-tag.checkup { background: #E3F2FD; color: #1565C0; }
.record-tag.other { background: #F3E5F5; color: #7B1FA2; }

.record-desc {
  font-size: 13px;
  color: #888;
  line-height: 1.5;
  margin-bottom: 8px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.record-meta {
  display: flex;
  gap: 12px;
  font-size: 11px;
  color: #BBB;
}

.record-meta-item {
  display: flex;
  align-items: center;
  gap: 3px;
}

.float-add {
  position: absolute;
  bottom: 100px;
  right: 20px;
  width: 48px;
  height: 48px;
  border-radius: 24px;
  background: linear-gradient(135deg, #FF9800, #FFB74D);
  color: #fff;
  font-size: 24px;
  border: none;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(255, 152, 0, 0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 5;
}

.tab-bar {
  display: flex;
  background: #fff;
  border-top: 1px solid #F0EDE8;
  padding: 8px 0 20px;
  margin-top: auto;
}

.tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
.tab-icon { font-size: 22px; }
.tab-label { font-size: 10px; color: #999; font-weight: 500; }
.tab-item.active .tab-label { color: #FF9800; font-weight: 700; }
</style>
</head>
<body>

<div class="phone-frame">
  <div class="status-bar">
    <span>9:41</span>
    <span>📶 🔋</span>
  </div>

  <div class="nav-bar">
    <button class="nav-back">‹</button>
    <div class="nav-title">病史备注</div>
  </div>

  <div class="content-scroll">

    <div class="pet-mini">
      <div class="pet-mini-avatar">🐱</div>
      <div class="pet-mini-name">花花</div>
      <div class="pet-mini-arrow">›</div>
    </div>

    <div class="category-tabs">
      <button class="category-tab active" onclick="switchTab(this, '全部')">全部<span class="count">3</span></button>
      <button class="category-tab" onclick="switchTab(this, '手术')">手术<span class="count">1</span></button>
      <button class="category-tab" onclick="switchTab(this, '疾病')">疾病<span class="count">1</span></button>
      <button class="category-tab" onclick="switchTab(this, '体检')">体检<span class="count">1</span></button>
    </div>

    <div class="record-card" data-tag="手术">
      <div class="record-header">
        <span class="record-title">绝育手术</span>
        <span class="record-tag surgery">手术</span>
      </div>
      <div class="record-desc">2025年6月在宠爱国际动物医院完成绝育手术，术后恢复良好，一周后拆线，无并发症。</div>
      <div class="record-meta">
        <span class="record-meta-item">📅 2025-06-15</span>
        <span class="record-meta-item">🏥 宠爱国际动物医院</span>
      </div>
    </div>

    <div class="record-card" data-tag="疾病">
      <div class="record-header">
        <span class="record-title">耳螨治疗</span>
        <span class="record-tag illness">疾病</span>
      </div>
      <div class="record-desc">发现右耳有褐色分泌物，确诊耳螨感染。使用耳肤灵每日一次，连续两周，已痊愈。</div>
      <div class="record-meta">
        <span class="record-meta-item">📅 2025-09-20</span>
        <span class="record-meta-item">🏥 瑞鹏宠物医院</span>
      </div>
    </div>

    <div class="record-card" data-tag="体检">
      <div class="record-header">
        <span class="record-title">年度体检</span>
        <span class="record-tag checkup">体检</span>
      </div>
      <div class="record-desc">血常规、生化全项、腹部B超均正常。体重3.2kg，医生建议注意控制饮食，保持体重在3.5kg以内。</div>
      <div class="record-meta">
        <span class="record-meta-item">📅 2026-01-10</span>
        <span class="record-meta-item">🏥 宠爱国际动物医院</span>
      </div>
    </div>

    <div style="padding-bottom: 20px;"></div>
  </div>

  <button class="float-add">＋</button>

  <div class="tab-bar">
    <div class="tab-item active">
      <div class="tab-icon">🐾</div>
      <div class="tab-label">宠物</div>
    </div>
    <div class="tab-item">
      <div class="tab-icon">📸</div>
      <div class="tab-label">相册</div>
    </div>
    <div class="tab-item">
      <div class="tab-icon">👤</div>
      <div class="tab-label">我的</div>
    </div>
  </div>
</div>

<script>
function switchTab(btn, filter) {
  document.querySelectorAll('.category-tab').forEach(function(t) { t.classList.remove('active'); });
  btn.classList.add('active');
  document.querySelectorAll('.record-card').forEach(function(card) {
    if (filter === '全部' || card.getAttribute('data-tag') === filter) {
      card.style.display = '';
    } else {
      card.style.display = 'none';
    }
  });
}
</script>
</body>
</html>
