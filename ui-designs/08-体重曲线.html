<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>界面八：体重曲线 - 宠物健康管家</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background: #f0f0f0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

.phone-frame {
  width: 375px;
  height: 812px;
  background: #F8F6F2;
  border-radius: 40px;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  position: relative;
  display: flex;
  flex-direction: column;
}

.status-bar {
  padding: 12px 24px 6px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  color: #333;
  font-weight: 600;
}

.nav-bar {
  padding: 8px 16px 4px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.nav-back {
  width: 32px;
  height: 32px;
  border-radius: 16px;
  background: #fff;
  border: none;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  flex-shrink: 0;
}

.nav-title {
  font-size: 16px;
  font-weight: 700;
  color: #2D2D2D;
  flex: 1;
}

.content-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 0 16px;
}

.pet-mini {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  margin: 10px 0;
  background: #fff;
  border-radius: 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.03);
}

.pet-mini-avatar { font-size: 28px; flex-shrink: 0; }
.pet-mini-name { font-size: 14px; font-weight: 700; color: #2D2D2D; }
.pet-mini-arrow { font-size: 14px; color: #CCC; margin-left: auto; }

.weight-now-card {
  background: #fff;
  border-radius: 16px;
  padding: 16px 18px;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.03);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.weight-now-label { font-size: 13px; color: #999; font-weight: 600; }
.weight-now-value { font-size: 36px; font-weight: 800; color: #2D2D2D; }
.weight-now-value span { font-size: 16px; font-weight: 600; color: #999; margin-left: 4px; }
.weight-now-date { font-size: 11px; color: #BBB; margin-top: 2px; }

.weight-now-change { display: flex; flex-direction: column; align-items: flex-end; }
.weight-change-badge { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 12px; margin-bottom: 4px; }
.weight-change-badge.up { background: #FFEBEE; color: #D32F2F; }
.weight-change-badge.down { background: #E8F5E9; color: #2E7D32; }
.weight-change-badge.same { background: #F5F5F5; color: #999; }
.weight-now-bmi { font-size: 11px; color: #BBB; }

.chart-card {
  background: #fff;
  border-radius: 16px;
  padding: 16px 8px;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.03);
}

.chart-tabs {
  display: flex;
  gap: 4px;
  padding: 0 8px;
  margin-bottom: 12px;
  background: #F5F2ED;
  border-radius: 10px;
  width: fit-content;
}

.chart-tab {
  padding: 5px 14px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  color: #999;
  cursor: pointer;
  border: none;
  background: none;
}

.chart-tab.active { background: #fff; color: #FF9800; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }

.chart-container {
  position: relative;
  height: 200px;
  margin: 0 8px;
  cursor: pointer;
}

canvas { width: 100%; height: 100%; }

.chart-tooltip {
  position: absolute;
  background: #2D2D2D;
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  padding: 6px 10px;
  border-radius: 6px;
  pointer-events: none;
  display: none;
  white-space: nowrap;
  transform: translate(-50%, -100%);
  z-index: 2;
}

.chart-tooltip::after {
  content: '';
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  border: 5px solid transparent;
  border-top-color: #2D2D2D;
}

.records-title {
  font-size: 13px;
  font-weight: 700;
  color: #999;
  padding: 0 4px 10px;
  margin-top: 4px;
}

.record-card {
  background: #fff;
  border-radius: 14px;
  padding: 14px 16px;
  margin-bottom: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.03);
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
}

.record-dot { width: 8px; height: 8px; border-radius: 50%; background: #FF9800; flex-shrink: 0; }
.record-info { flex: 1; }
.record-date { font-size: 13px; color: #888; margin-bottom: 2px; }
.record-weight { font-size: 18px; font-weight: 700; color: #2D2D2D; }
.record-weight span { font-size: 12px; color: #999; font-weight: 500; margin-left: 4px; }
.record-change { font-size: 12px; font-weight: 600; }
.record-change.up { color: #D32F2F; }
.record-change.down { color: #2E7D32; }
.record-change.same { color: #999; }
.record-arrow { font-size: 14px; color: #CCC; }

.float-add {
  position: absolute;
  bottom: 100px;
  right: 20px;
  width: 48px;
  height: 48px;
  border-radius: 24px;
  background: linear-gradient(135deg, #FF9800, #FFB74D);
  color: #fff;
  font-size: 24px;
  border: none;
  cursor: pointer;
  box-shadow: 0 4px 16px rgba(255, 152, 0, 0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 5;
}

.tab-bar {
  display: flex;
  background: #fff;
  border-top: 1px solid #F0EDE8;
  padding: 8px 0 20px;
  margin-top: auto;
}

.tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
.tab-icon { font-size: 22px; }
.tab-label { font-size: 10px; color: #999; font-weight: 500; }
.tab-item.active .tab-label { color: #FF9800; font-weight: 700; }
</style>
</head>
<body>

<div class="phone-frame">
  <div class="status-bar">
    <span>9:41</span>
    <span>📶 🔋</span>
  </div>

  <div class="nav-bar">
    <button class="nav-back">‹</button>
    <div class="nav-title">体重曲线</div>
  </div>

  <div class="content-scroll">

    <div class="pet-mini">
      <div class="pet-mini-avatar">🐱</div>
      <div class="pet-mini-name">花花</div>
      <div class="pet-mini-arrow">›</div>
    </div>

    <div class="weight-now-card">
      <div>
        <div class="weight-now-label">当前体重</div>
        <div class="weight-now-value">4.2<span>kg</span></div>
        <div class="weight-now-date">记录于 2026-08-15</div>
      </div>
      <div class="weight-now-change">
        <div class="weight-change-badge up">↑ 0.3kg</div>
        <div class="weight-now-bmi">较上次 +7.7%</div>
      </div>
    </div>

    <div class="chart-card">
      <div class="chart-tabs">
        <button class="chart-tab" onclick="switchChart('1m', this)">1月</button>
        <button class="chart-tab active" onclick="switchChart('3m', this)">3月</button>
        <button class="chart-tab" onclick="switchChart('1y', this)">1年</button>
      </div>
      <div class="chart-container" id="chartContainer">
        <canvas id="weightChart"></canvas>
        <div class="chart-tooltip" id="chartTooltip"></div>
      </div>
    </div>

    <div class="records-title">📋 体重记录</div>

    <div class="record-card">
      <div class="record-dot"></div>
      <div class="record-info">
        <div class="record-date">2026-08-15</div>
        <div class="record-weight">4.2<span>kg</span></div>
      </div>
      <div class="record-change up">↑ 0.3</div>
      <div class="record-arrow">›</div>
    </div>

    <div class="record-card">
      <div class="record-dot" style="background:#DDD;"></div>
      <div class="record-info">
        <div class="record-date">2026-07-15</div>
        <div class="record-weight">3.9<span>kg</span></div>
      </div>
      <div class="record-change same">-</div>
      <div class="record-arrow">›</div>
    </div>

    <div class="record-card">
      <div class="record-dot" style="background:#DDD;"></div>
      <div class="record-info">
        <div class="record-date">2026-06-15</div>
        <div class="record-weight">3.7<span>kg</span></div>
      </div>
      <div class="record-change up">↑ 0.2</div>
      <div class="record-arrow">›</div>
    </div>

    <div class="record-card">
      <div class="record-dot" style="background:#DDD;"></div>
      <div class="record-info">
        <div class="record-date">2026-05-15</div>
        <div class="record-weight">3.5<span>kg</span></div>
      </div>
      <div class="record-change same">-</div>
      <div class="record-arrow">›</div>
    </div>

    <div style="padding-bottom: 20px;"></div>
  </div>

  <button class="float-add">＋</button>

  <div class="tab-bar">
    <div class="tab-item active">
      <div class="tab-icon">🐾</div>
      <div class="tab-label">宠物</div>
    </div>
    <div class="tab-item">
      <div class="tab-icon">📸</div>
      <div class="tab-label">相册</div>
    </div>
    <div class="tab-item">
      <div class="tab-icon">👤</div>
      <div class="tab-label">我的</div>
    </div>
  </div>
</div>

<script>
var allData = {
  '1m': [
    { d: '7/20', v: 3.9, date: '2026-07-20' },
    { d: '7/25', v: 4.0, date: '2026-07-25' },
    { d: '7/30', v: 4.0, date: '2026-07-30' },
    { d: '8/5', v: 4.1, date: '2026-08-05' },
    { d: '8/10', v: 4.1, date: '2026-08-10' },
    { d: '8/15', v: 4.2, date: '2026-08-15' }
  ],
  '3m': [
    { d: '5月', v: 3.5, date: '2026-05-15' },
    { d: '6月', v: 3.7, date: '2026-06-15' },
    { d: '7月', v: 3.9, date: '2026-07-15' },
    { d: '8月', v: 4.2, date: '2026-08-15' }
  ],
  '1y': [
    { d: '1月', v: 3.0, date: '2026-01-15' },
    { d: '3月', v: 3.2, date: '2026-03-15' },
    { d: '5月', v: 3.5, date: '2026-05-15' },
    { d: '7月', v: 3.9, date: '2026-07-15' },
    { d: '8月', v: 4.2, date: '2026-08-15' }
  ]
};

var currentPeriod = '3m';
var chartPoints = [];

function switchChart(period, btn) {
  document.querySelectorAll('.chart-tab').forEach(function(t) { t.classList.remove('active'); });
  btn.classList.add('active');
  currentPeriod = period;
  document.getElementById('chartTooltip').style.display = 'none';
  drawChart();
}

function drawChart() {
  var canvas = document.getElementById('weightChart');
  var ctx = canvas.getContext('2d');
  var dpr = window.devicePixelRatio || 1;
  var rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = 200 * dpr;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = '200px';
  ctx.scale(dpr, dpr);

  var w = rect.width;
  var h = 200;
  var pad = { top: 20, right: 16, bottom: 30, left: 40 };
  var pw = w - pad.left - pad.right;
  var ph = h - pad.top - pad.bottom;

  var data = allData[currentPeriod];
  var minV = Math.floor(Math.min.apply(null, data.map(function(d){return d.v;})) - 0.5);
  var maxV = Math.ceil(Math.max.apply(null, data.map(function(d){return d.v;})) + 0.5);
  var steps = 4;

  ctx.strokeStyle = '#F0EDE8';
  ctx.lineWidth = 1;
  for (var i = 0; i <= steps; i++) {
    var y = pad.top + (ph / steps) * i;
    ctx.beginPath();
    ctx.moveTo(pad.left, y);
    ctx.lineTo(w - pad.right, y);
    ctx.stroke();
    var val = maxV - ((maxV - minV) / steps) * i;
    ctx.fillStyle = '#BBB';
    ctx.font = '10px -apple-system, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(val.toFixed(1) + 'kg', pad.left - 6, y + 4);
  }

  ctx.fillStyle = '#BBB';
  ctx.textAlign = 'center';
  for (var i = 0; i < data.length; i++) {
    ctx.fillText(data[i].d, pad.left + (pw / (data.length - 1)) * i, h - 8);
  }

  var gradient = ctx.createLinearGradient(0, pad.top, 0, h - pad.bottom);
  gradient.addColorStop(0, 'rgba(255, 152, 0, 0.2)');
  gradient.addColorStop(1, 'rgba(255, 152, 0, 0.0)');

  chartPoints = [];
  for (var i = 0; i < data.length; i++) {
    var x = pad.left + (pw / (data.length - 1)) * i;
    var y = pad.top + ph - ((data[i].v - minV) / (maxV - minV)) * ph;
    chartPoints.push({ x: x, y: y, v: data[i].v, date: data[i].date });
  }

  ctx.beginPath();
  ctx.moveTo(chartPoints[0].x, h - pad.bottom);
  for (var i = 0; i < chartPoints.length; i++) ctx.lineTo(chartPoints[i].x, chartPoints[i].y);
  ctx.lineTo(chartPoints[chartPoints.length - 1].x, h - pad.bottom);
  ctx.closePath();
  ctx.fillStyle = gradient;
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(chartPoints[0].x, chartPoints[0].y);
  for (var i = 1; i < chartPoints.length; i++) ctx.lineTo(chartPoints[i].x, chartPoints[i].y);
  ctx.strokeStyle = '#FF9800';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  for (var i = 0; i < chartPoints.length; i++) {
    ctx.beginPath();
    ctx.arc(chartPoints[i].x, chartPoints[i].y, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.strokeStyle = '#FF9800';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  var last = chartPoints[chartPoints.length - 1];
  ctx.fillStyle = '#FF9800';
  ctx.font = 'bold 11px -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(last.v.toFixed(1) + 'kg', last.x, last.y - 14);
}

document.getElementById('chartContainer').addEventListener('click', function(e) {
  var rect = this.getBoundingClientRect();
  var mx = e.clientX - rect.left;
  var my = e.clientY - rect.top;
  var hit = null;
  var minDist = 30;
  for (var i = 0; i < chartPoints.length; i++) {
    var dx = mx - chartPoints[i].x;
    var dy = my - chartPoints[i].y;
    var dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < minDist) { minDist = dist; hit = chartPoints[i]; }
  }
  var tooltip = document.getElementById('chartTooltip');
  if (hit) {
    tooltip.textContent = hit.date + '  ' + hit.v.toFixed(1) + 'kg';
    tooltip.style.left = hit.x + 'px';
    tooltip.style.top = (hit.y - 10) + 'px';
    tooltip.style.display = 'block';
  } else {
    tooltip.style.display = 'none';
  }
});

drawChart();
window.addEventListener('resize', drawChart);
</script>
</body>
</html>
